<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Kamadgiri Crop Science</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --green-dark: #1a3d1f;
    --green-mid: #2e6b35;
    --green-light: #4a9b54;
    --gold: #c8a84b;
    --gold-light: #e8c870;
    --cream: #f5f0e8;
    --text: #1a1a14;
    --text-muted: #5a5a4a;
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--cream);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
    position: relative;
    overflow-x: hidden;
  }

  /* background pattern */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      radial-gradient(circle at 15% 20%, rgba(46,107,53,0.08) 0%, transparent 45%),
      radial-gradient(circle at 85% 80%, rgba(200,168,75,0.08) 0%, transparent 45%),
      repeating-linear-gradient(
        60deg,
        transparent,
        transparent 40px,
        rgba(46,107,53,0.03) 40px,
        rgba(46,107,53,0.03) 41px
      );
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* logo badge */

  .logo-ring svg { width: 44px; height: 44px; }

  .brand-name {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    color: var(--green-dark);
    text-align: center;
    line-height: 1.2;
    margin-bottom: 4px;
    animation: fadeDown 0.6s 0.1s ease both;
  }

  .brand-tagline {
    font-size: 13px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 2rem;
    animation: fadeDown 0.6s 0.2s ease both;
  }

  /* divider */
  .divider {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin-bottom: 2rem;
    animation: fadeDown 0.6s 0.25s ease both;
  }

  /* link cards */
  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 18px;
    border-radius: 14px;
    text-decoration: none;
    border: 1.5px solid transparent;
    transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    animation: fadeUp 0.5s ease both;
    cursor: pointer;
  }

  .link-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 32px rgba(26,61,31,0.15);
    border-color: var(--gold);
  }

  .link-card:active { transform: translateY(-1px); }

  .card-facebook  { background: #fff; animation-delay: 0.35s; }
  .card-instagram { background: #fff; animation-delay: 0.45s; }
  .card-website   { background: var(--green-dark); animation-delay: 0.55s; }
  .card-youtube   { background: #fff; animation-delay: 0.65s; }
  .card-linkedin  { background: #fff; animation-delay: 0.75s; }

  .card-icon {
    width: 42px;
    height: 42px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .icon-fb   { background: #1877F2; }
  .icon-ig   { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); }
  .icon-web  { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); }
  .icon-yt   { background: #FF0000; }
  .icon-li   { background: #0A66C2; }

  .card-icon svg { width: 20px; height: 20px; }

  .card-text { flex: 1; }

  .card-label {
    font-size: 15px;
    font-weight: 500;
    line-height: 1.2;
  }

  .card-sub {
    font-size: 12px;
    font-weight: 300;
    opacity: 0.6;
    margin-top: 2px;
  }

  .card-website .card-label,
  .card-website .card-sub { color: #fff; }

  .card-arrow {
    font-size: 16px;
    opacity: 0.3;
    transition: opacity 0.2s, transform 0.2s;
  }
  .card-website .card-arrow { color: var(--gold-light); }
  .link-card:hover .card-arrow { opacity: 1; transform: translateX(3px); }

  /* footer */
  .footer {
    margin-top: 2rem;
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.05em;
    text-align: center;
    animation: fadeUp 0.5s 0.75s ease both;
  }

  .leaf-row {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 6px;
    opacity: 0.4;
  }

  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
